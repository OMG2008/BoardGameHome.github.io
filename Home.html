<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }
        nav {
            margin: 20px 0;
        }
        nav a {
            text-decoration: none;
            color: #333;
            margin: 0 15px;
            font-size: 18px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .cta {
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #ff5733;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Board Games Club</h1>
        <p>Where strategy, fun, and friendships begin!</p>
    </header>
    
    <nav>
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#games">Games</a>
        <a href="#join">Join Us</a>
    </nav>
    
    <div class="container">
        <h2>About Us</h2>
        <p>We are a community of board game enthusiasts who gather to play, compete, and have fun!</p>
        <button class="cta">Join the Fun!</button>
    </div>
</body>
</html>
